name: CI - AI Service

on:
  push:
    branches: [ "main", "feat/ai/llm" ]
    paths:
      - 'apps/ai/**'
      - '.github/workflows/ci-ai.yml'
      - 'pytest.ini'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/ai/**'
      - '.github/workflows/ci-ai.yml'
      - 'pytest.ini'

jobs:
  test-ai-service:
    name: Test AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai/requirements.txt
          pip install httpx pytest pyright

      - name: Check code with Pyright
        run: pyright apps/ai/server.py

      - name: Run Unit Tests
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
        run: pytest apps/ai/tests/
