name: CI

on:
  push:
    branches: [ "main", "infra/postgresql" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-postgresql:
    name: Test PostgreSQL Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        run: |
          cat << 'EOF' > .env
          POSTGRES_DB=transcendence
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          EOF

      - name: Start PostgreSQL Container
        run: docker compose up -d database

      - name: Wait for PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL service to be ready..."
          for i in {1..30}; do
            if docker compose exec -T database pg_isready -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Verify Database Initialization & Schema
        run: |
          echo "Checking table list..."
          docker compose exec -T database psql -U postgres -d transcendence -c "\dt"

          echo "Verifying seed data in users table..."
          docker compose exec -T database psql -U postgres -d transcendence -c "SELECT * FROM users;" | grep "admin_test"

      - name: Stop Containers
        if: always()
        run: docker compose down -v
