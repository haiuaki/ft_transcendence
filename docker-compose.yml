services:
  database:
    image: postgres:18-alpine
    container_name: postgresql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - app_network
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
    name: transcendence_db_data

networks:
  app_network:
    name: transcendence_network
    driver: bridge
