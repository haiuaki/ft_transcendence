services:
  database:
    build: ./infra/postgresql
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - app_network
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build: ./apps/backend
    container_name: go_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
    depends_on:
      - database
    networks:
      - app_network

  ai-service:
    build: ./apps/ai
    container_name: ai_bot
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: nextjs
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app_network

  nginx:
    build: ./infra/nginx
    container_name: reverse_proxy
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      - frontend
    networks:
      - app_network

volumes:
  db_data:
    name: transcendence_db_data

networks:
  app_network:
    name: transcendence_network
    driver: bridge
