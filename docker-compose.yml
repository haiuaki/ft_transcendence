services:
  database:
    image: pgvector/pgvector:pg17
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"
    networks:
      - app_network
    volumes:
      - db_data:/var/lib/postgresql
      - ./infra/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app_network

  backend:
    build: ./apps/backend
    container_name: go_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - app_network

  ai-service:
    build: ./apps/ai
    container_name: ai_bot
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

volumes:
  db_data:
    name: transcendence_db_data

networks:
  app_network:
    name: transcendence_network
    driver: bridge
